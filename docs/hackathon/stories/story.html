<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Crypto Bot — story layers</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!--
      Слои вертикальной истории 1080×1920 (Instagram и Telegram Stories).
      make-social-cuts.mjs снимает каждый элемент с прозрачным фоном и накладывает
      их на видео. Верх (~200 px) и низ (~260 px) закрывают кнопки приложений —
      там ничего важного нет.
    -->
    <style>
      :root {
        --accent: #3b5bdb;
        --navy: #0b1020;
        --ink: #e8ecf5;
        --muted: #9aa4ba;
        --sol1: #9945ff;
        --sol2: #14f195;
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      body {
        font-family: Inter, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
        background: transparent;
        color: var(--ink);
      }

      .layer {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }

      .layer > svg {
        position: absolute;
        inset: 0;
      }

      .logo {
        width: 76px;
        height: 76px;
        border-radius: 22px;
        background: var(--accent);
        display: grid;
        place-items: center;
        flex: none;
      }

      .logo svg {
        width: 50px;
        height: 50px;
        stroke: #fff;
        stroke-width: 3.2;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .grad {
        background: linear-gradient(95deg, var(--sol1), var(--sol2));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      /* ---------- Рамка: фон с прозрачным окном под видео ---------- */
      .brand {
        position: absolute;
        left: 40px;
        top: 236px;
        display: flex;
        align-items: center;
        gap: 22px;
      }

      .brand b {
        display: block;
        font-size: 50px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }

      .brand span {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 4px;
        font-size: 25px;
        font-weight: 600;
        color: var(--muted);
      }

      .brand i {
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: var(--sol2);
        box-shadow: 0 0 14px var(--sol2);
      }

      /* ---------- Субтитры под видео ---------- */
      .caption {
        width: 1080px;
        height: 230px;
        display: grid;
        place-items: center;
        padding: 0 70px;
        text-align: center;
        font-size: 56px;
        line-height: 1.16;
        font-weight: 800;
        letter-spacing: -0.02em;
        text-shadow: 0 2px 18px rgba(0, 0, 0, 0.45);
      }

      /* ---------- Финальная карточка ---------- */
      .end .content {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding-bottom: 60px;
      }

      .end .logo {
        width: 150px;
        height: 150px;
        border-radius: 42px;
        box-shadow: 0 24px 70px rgba(59, 91, 219, 0.45);
      }

      .end .logo svg {
        width: 98px;
        height: 98px;
      }

      .end h1 {
        margin-top: 46px;
        font-size: 108px;
        font-weight: 800;
        letter-spacing: -0.035em;
      }

      .end p {
        margin-top: 18px;
        font-size: 58px;
        line-height: 1.15;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .end .chips {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        margin-top: 64px;
      }

      .end .chips span {
        padding: 14px 28px;
        border-radius: 999px;
        font-size: 30px;
        font-weight: 600;
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255, 255, 255, 0.14);
      }
    </style>
  </head>
  <body>
    <!-- Окно под видео: x 40, y 430, 1000×958, скругление 34 -->
    <div id="frame" class="layer">
      <svg viewBox="0 0 1080 1920">
        <defs>
          <radialGradient id="glow1" cx="0.9" cy="0.05" r="0.75">
            <stop offset="0" stop-color="#9945ff" stop-opacity="0.34" />
            <stop offset="1" stop-color="#9945ff" stop-opacity="0" />
          </radialGradient>
          <radialGradient id="glow2" cx="0.05" cy="0.98" r="0.7">
            <stop offset="0" stop-color="#14f195" stop-opacity="0.16" />
            <stop offset="1" stop-color="#14f195" stop-opacity="0" />
          </radialGradient>
          <path
            id="shape"
            fill-rule="evenodd"
            d="M0 0H1080V1920H0Z M74 430H1006A34 34 0 0 1 1040 464V1354A34 34 0 0 1 1006 1388H74A34 34 0 0 1 40 1354V464A34 34 0 0 1 74 430Z"
          />
        </defs>
        <use href="#shape" fill="#0b1020" />
        <use href="#shape" fill="url(#glow1)" />
        <use href="#shape" fill="url(#glow2)" />
        <rect
          x="39"
          y="429"
          width="1002"
          height="960"
          rx="35"
          fill="none"
          stroke="rgba(255,255,255,0.16)"
          stroke-width="2"
        />
      </svg>
      <div class="brand">
        <div class="logo">
          <svg viewBox="0 0 32 32"><path d="M7 21l6-6 4 4 8-9" /></svg>
        </div>
        <div>
          <b>Crypto Bot</b>
          <span><i></i>Live demo · Solana · real Jupiter quotes</span>
        </div>
      </div>
    </div>

    <div id="cap1" class="caption">Meet Crypto Bot: a trend-following autopilot</div>
    <div id="cap2" class="caption">
      <div>that trades on <span class="grad">Solana</span> and proves every decision on-chain</div>
    </div>

    <div id="end" class="layer end">
      <svg viewBox="0 0 1080 1920">
        <defs>
          <radialGradient id="eglow1" cx="0.85" cy="0.1" r="0.8">
            <stop offset="0" stop-color="#9945ff" stop-opacity="0.38" />
            <stop offset="1" stop-color="#9945ff" stop-opacity="0" />
          </radialGradient>
          <radialGradient id="eglow2" cx="0.1" cy="0.95" r="0.75">
            <stop offset="0" stop-color="#14f195" stop-opacity="0.2" />
            <stop offset="1" stop-color="#14f195" stop-opacity="0" />
          </radialGradient>
        </defs>
        <rect width="1080" height="1920" fill="#0b1020" />
        <rect width="1080" height="1920" fill="url(#eglow1)" />
        <rect width="1080" height="1920" fill="url(#eglow2)" />
      </svg>
      <div class="content">
        <div class="logo">
          <svg viewBox="0 0 32 32"><path d="M7 21l6-6 4 4 8-9" /></svg>
        </div>
        <h1>Crypto Bot</h1>
        <p>Trend-following<br />you can <span class="grad">verify.</span></p>
        <div class="chips">
          <span>One decision a day</span>
          <span>Jupiter swaps from your wallet</span>
          <span>Every decision proven on Solana</span>
        </div>
      </div>
    </div>
  </body>
</html>
