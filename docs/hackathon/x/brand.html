<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Crypto Bot — X profile images</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Кривая капитала стратегии из бэктеста (docs/hackathon/export-backtest.ts) -->
    <script src="../assets/backtest-data.js"></script>
    <style>
      :root {
        --accent: #3b5bdb;
        --navy: #0b1020;
        --ink: #e8ecf5;
        --muted: #9aa4ba;
        --sol1: #9945ff;
        --sol2: #14f195;
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      body {
        font-family: Inter, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
        background: #fff;
        display: grid;
        gap: 40px;
        padding: 40px;
        justify-items: start;
      }

      /* ---------- Аватар 400×400: X обрезает его кругом ---------- */
      #avatar {
        width: 400px;
        height: 400px;
        display: grid;
        place-items: center;
        background:
          radial-gradient(260px 260px at 78% 18%, rgba(153, 69, 255, 0.55), transparent 70%),
          radial-gradient(240px 240px at 18% 92%, rgba(20, 241, 149, 0.28), transparent 70%),
          var(--accent);
      }

      #avatar svg {
        width: 310px;
        height: 310px;
        stroke: #fff;
        stroke-width: 3.3;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      #avatar .dot {
        fill: var(--sol2);
        stroke: none;
      }

      /* ---------- Шапка 1500×500 ---------- */
      #header {
        position: relative;
        width: 1500px;
        height: 500px;
        overflow: hidden;
        color: var(--ink);
        background:
          radial-gradient(900px 520px at 88% 0%, rgba(153, 69, 255, 0.3), transparent 62%),
          radial-gradient(700px 480px at 0% 100%, rgba(20, 241, 149, 0.14), transparent 60%),
          var(--navy);
      }

      #curve {
        position: absolute;
        inset: 0;
      }

      /* Текст держим в центре-справа: слева внизу шапку перекрывает аватар,
         а на телефоне X срезает верх и низ */
      .copy {
        position: absolute;
        left: 430px;
        top: 118px;
        width: 960px;
      }

      .kicker {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        font-size: 19px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .kicker i {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--sol2);
        box-shadow: 0 0 14px var(--sol2);
      }

      h1 {
        margin-top: 18px;
        font-size: 76px;
        line-height: 1.02;
        font-weight: 800;
        letter-spacing: -0.03em;
      }

      .grad {
        background: linear-gradient(95deg, var(--sol1), var(--sol2));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .chips {
        display: flex;
        gap: 12px;
        margin-top: 30px;
      }

      .chips span {
        padding: 10px 18px;
        border-radius: 999px;
        font-size: 20px;
        font-weight: 600;
        color: var(--ink);
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255, 255, 255, 0.12);
      }
    </style>
  </head>
  <body>
    <div id="avatar">
      <svg viewBox="0 0 32 32">
        <path d="M7 21l6-6 4 4 8-9" />
        <circle class="dot" cx="25" cy="10" r="2.1" />
      </svg>
    </div>

    <div id="header">
      <svg id="curve" viewBox="0 0 1500 500" preserveAspectRatio="none"></svg>
      <div class="copy">
        <div class="kicker"><i></i>Crypto Bot · built on Solana</div>
        <h1>Trend-following<br />you can <span class="grad">verify.</span></h1>
        <div class="chips">
          <span>One decision a day</span>
          <span>Jupiter swaps from your wallet</span>
          <span>Proof-of-Trend on-chain</span>
        </div>
      </div>
    </div>

    <script>
      // Настоящая кривая капитала стратегии (логарифмическая шкала) как фон шапки
      const points = window.BACKTEST.btcEth.strategy;
      const logs = points.map(([, equity]) => Math.log(equity));
      const min = Math.min(...logs);
      const max = Math.max(...logs);
      const path = points
        .map(([, equity], index) => {
          const x = 40 + (index / (points.length - 1)) * 1440;
          const y = 470 - ((Math.log(equity) - min) / (max - min)) * 400;
          return `${index ? 'L' : 'M'}${x.toFixed(1)},${y.toFixed(1)}`;
        })
        .join('');
      document.getElementById('curve').innerHTML = `
        <defs>
          <linearGradient id="line" x1="0" x2="1">
            <stop offset="0" stop-color="#9945ff" stop-opacity="0.08" />
            <stop offset="0.45" stop-color="#9945ff" stop-opacity="0.18" />
            <stop offset="0.75" stop-color="#6d7cf0" stop-opacity="0.6" />
            <stop offset="1" stop-color="#14f195" stop-opacity="0.95" />
          </linearGradient>
          <linearGradient id="fill" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0" stop-color="#14f195" stop-opacity="0.1" />
            <stop offset="1" stop-color="#14f195" stop-opacity="0" />
          </linearGradient>
        </defs>
        <path d="${path}L1480,500L40,500Z" fill="url(#fill)" />
        <path d="${path}" fill="none" stroke="url(#line)" stroke-width="3" stroke-linejoin="round" />`;
    </script>
  </body>
</html>
